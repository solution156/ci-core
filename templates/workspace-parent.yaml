# Parent validates the source and creates a native GitLab dynamic child pipeline.
include:
  - local: /templates/common.yaml
stages: [validate, plan, build, scan, sign, promote, cleanup]

ci:tools:
  extends: .tools
  stage: validate
  needs: []
  rules: &parent_jobs
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"'

validate:catalog:
  stage: validate
  rules: *parent_jobs
  image: $PYTHON_IMAGE
  needs:
    - job: ci:tools
      artifacts: true
  script:
    - python3 .ci-tools/scripts/pipeline.py validate

validate:shell:
  stage: validate
  rules: *parent_jobs
  image: $SHELL_IMAGE
  needs: []
  before_script:
    - command -v bash >/dev/null || apk add --no-cache bash
  script:
    - find images shared -type f -name '*.sh' -exec bash -n '{}' ';'

security:source:
  stage: validate
  rules: *parent_jobs
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  needs: []
  script:
    - mkdir -p reports
    # Scan with exit-code 0 so the diagnostic below always runs. The Python
    # check reproduces the strict gate: any HIGH/CRITICAL finding fails the job.
    - trivy fs --scanners secret,misconfig --severity HIGH,CRITICAL --exit-code 0 --format json --output reports/source.json --skip-dirs .ci-tools .
    - test -s reports/source.json
    - python3 -c 'import json,sys; d=json.load(open("reports/source.json")); rows=[(r.get("Target"),k,v.get("RuleID") or v.get("ID"),v.get("Severity")) for r in d.get("Results",[]) for k in ("Misconfigurations","Secrets") for v in (r.get(k) or [])]; print("SOURCE_FINDINGS:",rows or "none"); sys.exit(1 if rows else 0)'
  artifacts:
    when: always
    expire_in: 7 days
    paths: [reports/source.json]

prepare:plan:
  stage: plan
  rules: *parent_jobs
  image: $PYTHON_IMAGE
  needs:
    - {job: 'ci:tools', artifacts: true}
    - {job: 'validate:catalog', artifacts: false}
    - {job: 'validate:shell', artifacts: false}
    - {job: 'security:source', artifacts: false}
  script:
    - python3 .ci-tools/scripts/plan.py --output generated-child.yml
    - |
      mode="$(python3 -c 'import json; print(json.load(open("pipeline-plan.json"))["mode"])')"
      if [ "$mode" != fast ]; then
        : "${IMAGE_GATE_TOOLS_IMAGE:?Set IMAGE_GATE_TOOLS_IMAGE to the pinned build-gate tool image}"
        : "${COSIGN_IMAGE:?Set COSIGN_IMAGE to a pinned shell-capable image}"
        if [ "${DEVGUARD_ENABLED:-false}" = true ]; then
          : "${DEVGUARD_SCANNER_IMAGE:?Set DEVGUARD_SCANNER_IMAGE when enabling DevGuard}"
        fi
      fi
    - cat pipeline-plan.json
  artifacts:
    expire_in: 7 days
    paths: [generated-child.yml, pipeline-plan.json]

pipeline:images:
  stage: build
  rules: *parent_jobs
  needs:
    - {job: 'prepare:plan', artifacts: true}
  # Trigger/bridge jobs have no image, services or script.
  trigger:
    include:
      - artifact: generated-child.yml
        job: prepare:plan
    strategy: mirror  # GitLab >=18.2; use depend for older installations.
    forward:
      yaml_variables: true
      pipeline_variables: false

cleanup:root:
  stage: cleanup
  rules: *parent_jobs
  image: $SHELL_IMAGE
  when: always
  needs:
    - job: pipeline:images
      artifacts: false
  script:
    - echo 'Only job-local files are disposable; no daemon prune or registry deletion.'
